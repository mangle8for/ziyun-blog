# ============================================================
# 紫云博客 · Redis 7 内存限制（2C2G 服务器）
# 挂载位置：/usr/local/etc/redis/redis.conf
#
# 用途：登录态令牌 + 登录限流，均为「可重建数据」。
# 权衡：关闭持久化后 Redis 重启会使所有用户重新登录，
#      个人博客低频访问可接受；换来更小的内存与 IO 开销。
# ============================================================

# 内存上限：容器 mem_limit 256m，实际仅用 128m
maxmemory 128mb

# 内存满时淘汰策略：allkeys-lru 优先淘汰最久未使用的键（含带过期时间的登录态）
maxmemory-policy allkeys-lru

# 关闭 RDB 快照持久化（默认 save 900 1 300 10 60 10000）
save ""

# 关闭 AOF 追加持久化
appendonly no
