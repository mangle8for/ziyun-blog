# ============================================================
# 紫云博客 · Nginx 站点配置
# 容器内路径：/etc/nginx/conf.d/blog.conf（由 docker-compose 挂载）
#
# 注意：__DOMAIN__ 是占位符，部署脚本 deploy.sh 会读取服务器
# .env 里的 DOMAIN 并替换（Nginx 的 $ 变量不受影响）。
# ============================================================

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # 与后端 multipart 限制对齐（封面上传，最大请求 6MB）
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源：长缓存（Vite 产物文件名带内容指纹）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history 路由回退：未知路径一律回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器（compose 网络内服务名 backend）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

