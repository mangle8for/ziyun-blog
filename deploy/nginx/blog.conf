# ============================================================
# 紫云博客 · Nginx 站点配置（HTTP + HTTPS）
# 容器内路径：/etc/nginx/conf.d/blog.conf（由 docker-compose 挂载）
#
# 注意：
#   1. __DOMAIN__ 是占位符，部署脚本 deploy.sh 会读取服务器
#      .env 里的 DOMAIN 并替换（Nginx 的 $ 变量不受影响）；
#   2. HTTPS 证书：Let's Encrypt（certbot standalone 模式签发，
#      服务器 /etc/letsencrypt 挂载进容器，自动续期见 docs/DEPLOY.md）；
#   3. 证书文件必须已存在，nginx 才能启动 —— 首次部署流程：
#      先签发证书，再 push 本配置（见 docs/DEPLOY.md 第 13 章）。
# ============================================================

# ---------- 80：ACME 验证 + 全量跳转 HTTPS ----------
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # certbot webroot 验证通道（standalone 签发用不到，webroot 续期备用）
    location /.well-known/acme-challenge/ {
        root /var/www;
    }

    # 其余 HTTP 请求全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：HTTPS 站点 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Let's Encrypt 证书（bind mount 自宿主机 /etc/letsencrypt）
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全响应头（纵深防御） ----------
    # ⚠️ nginx 继承陷阱：任意 location 内出现 add_header 会整体丢弃
    # server 级 add_header（本 server 已无带 add_header 的 location，
    # /assets/ 用 expires 指令自动生成 Cache-Control）。
    # HSTS：强制 HTTPS，防 SSL 剥离；过期后仅对本域生效（无 includeSubDomains 子域）。
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 防点击劫持：禁止页面被 iframe 嵌入（非本站来源）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 防 MIME 嗅探：禁止浏览器猜测资源类型执行
    add_header X-Content-Type-Options "nosniff" always;
    # 控制 Referer 携带范围（防跨站泄露 URL 中的敏感参数）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 基础 CSP：script-src 'self' 禁内联脚本（XSS 纵深防御）；
    # style-src 'unsafe-inline' 为 Element Plus/md-editor 大量内联样式必需；
    # img-src https: 覆盖阿里云 OSS 图片；frame-ancestors 与 X-Frame-Options 双保险
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 与后端 multipart 限制对齐（封面上传，最大请求 6MB）
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源：长缓存（Vite 产物文件名带内容指纹）。
    # 用 expires 而非 add_header Cache-Control —— 两者都会生成 Cache-Control
    # 头，而 add_header 会触发上文所述的继承陷阱丢弃 server 级安全头。
    location /assets/ {
        expires 30d;
    }

    # SPA history 路由回退：未知路径一律回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器（compose 网络内服务名 backend）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
