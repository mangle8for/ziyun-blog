# ============================================================
# 紫云博客 · Nginx 站点配置（HTTP + HTTPS 双栈直接服务）
# 容器内路径：/etc/nginx/conf.d/blog.conf（由 docker-compose 挂载）
#
# 注意：
#   1. __DOMAIN__ 是占位符，部署脚本 deploy.sh 会读取服务器
#      .env 里的 DOMAIN 并替换（Nginx 的 $ 变量不受影响）；
#   2. HTTPS 证书：Let's Encrypt（certbot standalone 模式签发，
#      服务器 /etc/letsencrypt 挂载进容器，自动续期见 docs/DEPLOY.md）；
#   3. 80 端口不再 301 跳转 HTTPS，而是与 443 一样直接提供全量服务：
#      域名未备案或证书异常（过期/续期失败）时，http:// 始终是一条
#      可用的兜底访问通道，浏览器不会再被带到坏证书页出现「风险提示」
#      （certbot 的 ACME 验证通道保留，续期不受影响）；
#   4. 相应地 443 不再下发 HSTS —— HSTS 会让访问过 HTTPS 的浏览器在
#      本地强制升级 http -> https（缓存最长一年），HTTP 兜底随之失效。
#      日后若恢复强制 HTTPS：取消 443 内 HSTS 注释、并把 80 的
#      location / 改回 return 301 https://$host$request_uri; 即可。
# ============================================================

# ---------- 80：ACME 验证 + 全量站点服务（HTTP 兜底通道） ----------
server {
    listen 80 default_server;
    # `_` 兜底：DNS 异常或直接用服务器 IP 访问时也能打开站点
    server_name __DOMAIN__ www.__DOMAIN__ _;

    # certbot webroot 验证通道（standalone 签发用不到，webroot 续期备用）
    location /.well-known/acme-challenge/ {
        root /var/www;
    }

    # 所有 text 响应显式声明 UTF-8：robots.txt 等无 meta 的纯文本
    # 依赖响应头 charset，缺失时客户端按本地编码解码中文会乱码
    charset utf-8;

    # ---------- 安全响应头（HTTP 上不下发 HSTS，其余与 443 对齐） ----------
    # ⚠️ nginx 继承陷阱：任意 location 内出现 add_header 会整体丢弃
    # server 级 add_header（本 server 的 location 均不带 add_header，
    # /assets/ 用 expires 指令自动生成 Cache-Control，不触发该陷阱）。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 与后端 multipart 限制对齐（封面上传，最大请求 6MB）
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源：长缓存（Vite 产物文件名带内容指纹）
    location /assets/ {
        expires 30d;
    }

    # Sitemap 标准根路径：反代到后端动态生成接口
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/v1/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 路由回退：未知路径一律回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器（compose 网络内服务名 backend）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI 写作流式接口（SSE）：必须关闭缓冲 —— nginx 默认会攒满缓冲区
    # 才下发，打字机效果会整段卡顿；读超时按流式生成上限放宽
    location /api/v1/ai/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # SSE 长连接：HTTP/1.1 保持与上游的连接复用
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ---------- 443：HTTPS 站点 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Let's Encrypt 证书（bind mount 自宿主机 /etc/letsencrypt）
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 所有 text 响应显式声明 UTF-8：robots.txt 等无 meta 的纯文本
    # 依赖响应头 charset，缺失时客户端按本地编码解码中文会乱码
    charset utf-8;

    # ---------- 安全响应头（纵深防御） ----------
    # ⚠️ nginx 继承陷阱：任意 location 内出现 add_header 会整体丢弃
    # server 级 add_header（本 server 已无带 add_header 的 location，
    # /assets/ 用 expires 指令自动生成 Cache-Control）。
    # HSTS 已按文件头注释第 4 条移除：与「HTTP 兜底可访问」冲突。
    # 恢复强制 HTTPS 时取消下行注释即可：
    # add_header Strict-Transport-Security "max-age=31536000" always;
    # 防点击劫持：禁止页面被 iframe 嵌入（非本站来源）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 防 MIME 嗅探：禁止浏览器猜测资源类型执行
    add_header X-Content-Type-Options "nosniff" always;
    # 控制 Referer 携带范围（防跨站泄露 URL 中的敏感参数）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 基础 CSP：script-src 'self' 禁内联脚本（XSS 纵深防御）；
    # style-src 'unsafe-inline' 为 Element Plus/md-editor 大量内联样式必需；
    # img-src https: 覆盖阿里云 OSS 图片；frame-ancestors 与 X-Frame-Options 双保险
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 与后端 multipart 限制对齐（封面上传，最大请求 6MB）
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源：长缓存（Vite 产物文件名带内容指纹）。
    # 用 expires 而非 add_header Cache-Control —— 两者都会生成 Cache-Control
    # 头，而 add_header 会触发上文所述的继承陷阱丢弃 server 级安全头。
    location /assets/ {
        expires 30d;
    }

    # Sitemap 标准根路径：反代到后端动态生成接口（Google 对根路径
    # sitemap 的抓取兼容性最好；robots.txt 已声明此 URL）
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/v1/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 路由回退：未知路径一律回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器（compose 网络内服务名 backend）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI 写作流式接口（SSE）：必须关闭缓冲 —— nginx 默认会攒满缓冲区
    # 才下发，打字机效果会整段卡顿；读超时按流式生成上限放宽
    location /api/v1/ai/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # SSE 长连接：HTTP/1.1 保持与上游的连接复用
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
