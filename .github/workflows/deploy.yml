# ============================================================
# 紫云博客 · CI/CD：push 到 main 自动构建并部署到云服务器
#
# 流程：
#   build  job（GitHub runner）：
#     前端 npm ci + build -> dist/
#     后端 mvnw package -> fat jar
#     打包 artifact（dist + jar + deploy/ 配置）
#   deploy job（依赖 build）：
#     生成 .env（密钥全部来自仓库 Secrets，不落仓库）
#     rsync 产物到服务器 /opt/ziyun-blog/releases/<sha>/
#     远程执行 deploy/scripts/deploy.sh（健康检查失败自动回滚）
#
# 依赖的仓库 Secrets（Settings -> Secrets and variables -> Actions）：
#   SERVER_HOST / SERVER_PORT / SERVER_USER / SERVER_SSH_KEY
#   DOMAIN / MYSQL_ROOT_PASSWORD / DB_PASSWORD / JWT_SECRET
#   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（必填，docker-compose 已强制）
# ============================================================
name: CI/CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一时间只允许一个部署任务，防止并发覆盖服务器版本
  group: ci-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-web/package-lock.json

      - name: Build frontend
        working-directory: blog-web
        run: |
          npm ci
          npm run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend
        working-directory: blog-server
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Assemble release artifact
        run: |
          mkdir -p artifact/dist
          cp -r blog-web/dist/* artifact/dist/
          cp blog-server/target/blog-server-0.0.1-SNAPSHOT.jar artifact/app.jar
          cp -r deploy artifact/deploy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-build
          path: artifact
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: blog-build
          path: artifact

      - name: Setup SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 校验私钥格式：若 Secret 粘贴时损坏（缺行/BOM/编码错误），
          # 此处立即报错并提示，避免拖到 ssh 阶段才失败
          if ! ssh-keygen -l -f ~/.ssh/deploy_key 2>/dev/null; then
            echo "::error::SERVER_SSH_KEY 私钥格式无效（error in libcrypto）。请重新复制服务器上的完整私钥（必须含 BEGIN/END 两行，无多余空格），更新 Secret 后重跑。" && exit 1
          fi
          # 固定服务器主机指纹，防止中间人攻击
          ssh-keyscan -p "${SERVER_PORT}" "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Generate .env
        run: |
          cat > .env <<'EOF'
          DOMAIN=${{ secrets.DOMAIN }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_USERNAME=blog
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}
          CORS_ALLOWED_ORIGINS=
          EOF

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          GIT_SHA="${GITHUB_SHA:0:7}"
          SSH="ssh -p ${SERVER_PORT} -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST}"
          SCP="scp -P ${SERVER_PORT} -i ~/.ssh/deploy_key"

          # 1. 创建发布目录并上传产物（rsync 增量传输，服务器需已装 rsync）
          ${SSH} "mkdir -p /opt/ziyun-blog/releases/${GIT_SHA}"
          rsync -az -e "ssh -p ${SERVER_PORT} -i ~/.ssh/deploy_key" \
            artifact/ "${SERVER_USER}@${SERVER_HOST}:/opt/ziyun-blog/releases/${GIT_SHA}/"

          # 2. 传输 .env（base64 编码，防止密码中的特殊字符破坏 shell）
          BASE64_ENV="$(base64 -w 0 .env)"

          # 3. 远程执行部署脚本（bash 调用，无需文件可执行位）
          ${SSH} "cd /opt/ziyun-blog/releases/${GIT_SHA}/deploy/scripts && BASE64_ENV='${BASE64_ENV}' bash deploy.sh ${GIT_SHA}"
