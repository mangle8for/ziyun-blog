# ============================================================
# 紫云博客 · 公共配置（所有环境共享）
# ============================================================
# 设计说明（Spring 配置分层机制）：
#   application.yml        公共配置，各环境必读
#   application-dev.yml    开发环境覆盖项（dev 通过 spring.profiles.active 激活）
#   application-prod.yml   生产环境覆盖项
#   同名 key 下，环境专属文件「覆盖」公共文件 —— 类似 CSS 层叠，
#   公共文件放基线值，环境文件只写差异，避免每个环境复制一大份配置。
# ============================================================
spring:
  application:
    name: blog-server

  # 默认激活 dev 环境（可用 --spring.profiles.active=prod 命令行覆盖）
  profiles:
    active: dev

  # ---------- 数据源（MySQL 8） ----------
  # 设计说明（连接串参数）：
  #  - serverTimezone=Asia/Shanghai：MySQL 8 驱动强制要求显式时区，否则启动报错
  #  - useSSL=false：本地开发无证书加密，开启会告警
  #  - allowPublicKeyRetrieval=true：MySQL 8 默认 caching_sha2_password 认证
  #    首次握手需要公钥交换，不开会报 Public Key Retrieval is not allowed
  #  - 密码不写死：${DB_PASSWORD:root} 语法 = 读环境变量 DB_PASSWORD，
  #    未设置时回退默认值 root（开发机省事，生产必须显式设置）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ziyun_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
    hikari:
      # HikariCP 连接池上限：博客并发不高，10 个够用
      maximum-pool-size: 10
      # 连接 5 秒拿不到就直接失败（fail-fast），便于本地快速发现 MySQL 没起
      connection-timeout: 5000

  # ---------- Redis（P2 起使用，先占位保证启动不报错） ----------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # 序列化方式统一为 UTF-8 JSON，避免中文乱码
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # ---------- 文件上传大小限制（P2 文件接口使用） ----------
  # 设计说明：Multipart 默认上限 1MB，图片上传必须调大。
  # 业务层还有 5MB 白名单校验（更早的入口拦截），这里的配置是
  # Servlet 容器级兜底 —— 两层都要，漏一层都可能出问题。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  # 优雅停机：接收到关闭信号后先拒绝新请求、处理完存量请求再退出
  shutdown: graceful

# ============================================================
# MyBatis-Plus 全局配置
# ============================================================
mybatis-plus:
  # Mapper 接口的 XML 文件位置（P1 起若有手写 SQL 放 src/main/resources/mapper/）
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类的包路径：XML 中可用简单类名代替全限定名
  type-aliases-package: fun.ziyun.blogserver.entity
  configuration:
    # 数据库下划线列名 <-> Java 驼峰属性 自动映射（article_id <-> articleId）
    map-underscore-to-camel-case: true
    # 打印 SQL 的日志实现：dev 环境覆盖为 StdOutImpl，公共处留空避免生产泄漏 SQL
  global-config:
    banner: false
    db-config:
      # 主键策略：雪花 ID（19 位 Long）。
      # 对比原生 MyBatis 自增：自增 ID 易被遍历抓取（如文章 ID 越爬越多），
      # 雪花 ID 全局唯一、无规律，且天然适合分布式分表（P1 详述与 JS 精度问题）。
      id-type: assign_id
      # 逻辑删除：所有表统一 deleted 字段，1=已删 0=未删。
      # MP 会自动给所有 SQL 追加 "AND deleted = 0"，查询层面直接滤掉已删数据。
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# 业务自定义配置（以 blog 为前缀的自定义命名空间）
# ============================================================
blog:
  # 站点根地址：Sitemap 生成用（与 nginx server_name 一致；生产可经 SITE_URL 覆盖）
  site-url: ${SITE_URL:https://ziyun.fun}
  jwt:
    # 签名密钥：必须通过环境变量 JWT_SECRET 注入（>= 32 字节）。
    # ⚠️ 历史版本曾有硬编码开发默认值并随公开仓库泄露，现已移除；
    # 生产（application-prod.yml）为必填无默认，本地开发请在
    # application-dev.yml 配置或经 IDE 环境变量注入。
    secret: ${JWT_SECRET:}
    # token 有效期 72 小时（博客站低频访问，无需短时效）
    expire-hours: 72
  # ---------- 文件存储抽象层 ----------
  # 设计说明（一键切换底层存储）：
  #   type 指定当前实现：oss（阿里云 OSS）/ minio（预留，接入时新增实现类即可）。
  #   业务代码只依赖 FileService 接口，不感知底层 —— 换存储 = 改一个配置值，
  #   无需数据迁移（图片地址是拼接出的 URL，key 规则一致即可复用）。
  storage:
    type: oss
    oss:
      # 区域 Endpoint（不带 bucket 前缀，SDK 拼接）
      endpoint: https://oss-cn-beijing.aliyuncs.com
      # ⚠️ 安全提醒：凭据只允许经环境变量注入（GitHub Actions Secrets ->
      # 服务器 .env -> 容器环境变量）。历史硬编码的开发 AK/SK 已随公开
      # 仓库泄露，务必在阿里云控制台轮换后，将新凭据配置到本地环境变量
      # （RAM 子账号，仅授予本 bucket 上传/删除权限）。
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      # 桶名（需在控制台预先创建，且设为「公共读」才能直接 URL 访问）
      bucket: ${OSS_BUCKET:ziyun-webstudy-project}
      # 桶内文件统一放 blog 目录下（OSS 无目录概念，key 前缀模拟，
      # 便于与桶内其他业务隔离、按前缀批量管理）
      base-path: ${OSS_BASE_PATH:blog}
  # ---------- AI 写作助手 ----------
  ai:
    # API Key 落库加密密钥（AES/GCM 派生源）：经环境变量 AI_ENCRYPT_KEY 注入；
    # 未配置时回退复用 jwt.secret（本地开发零配置）。⚠️ 换密钥后库中已存
    # 的 Key 将无法解密，需重新录入。
    encrypt-key: ${AI_ENCRYPT_KEY:}
    # 上游大模型接口超时（秒）：流式生成耗时以分钟计，读超时要给足
    connect-timeout-seconds: 10
    read-timeout-seconds: 180
    # 发送给模型的正文上下文最大字符数（控制 token 成本，超长截断）
    max-context-chars: 6000
  security:
    # 认证白名单：完全公开的路径（无需任何登录态）。
    # 注意：/auth/me 与 /auth/logout 需要「已登录」而非公开，
    # 故不在这里配置，而在 SecurityConfig 中用 authenticated() 单独声明。
    # 公开注册已移除，白名单仅剩登录。
    ignore-paths:
      - /api/v1/auth/login
