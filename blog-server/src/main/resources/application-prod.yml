# ============================================================
# 生产环境配置（spring.profiles.active=prod 时覆盖公共配置）
# ============================================================
server:
  # 生产端口可经环境变量覆盖（默认 8080）
  port: ${SERVER_PORT:8080}

spring:
  # 生产必须显式注入所有密钥，禁止使用公共配置里的默认回退值
  datasource:
    # sessionVariables 强制每个 JDBC 会话使用 utf8mb4：
    # 即使 Connector/J 与服务器协商出 latin1（历史踩坑：服务器端
    # character_set_server 正常为 utf8mb4，但 JDBC 会话被协商成 latin1，
    # 导致中文数据按 latin1 解码成乱码），也会在连接建立后被强制覆盖。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ziyun_blog}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    # 生产环境关闭 SQL 日志，避免 SQL 语句与参数值泄漏到日志文件
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn

blog:
  jwt:
    # 生产强制使用环境变量，不提供默认值（启动即失败，防止弱密钥上线）
    secret: ${JWT_SECRET}
  storage:
    type: ${STORAGE_TYPE:oss}
    oss:
      endpoint: ${OSS_ENDPOINT}
      # 生产不提供默认凭据：环境变量缺失直接启动失败
      access-key-id: ${OSS_ACCESS_KEY_ID}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET}
      bucket: ${OSS_BUCKET:ziyun-webstudy-project}
      base-path: ${OSS_BASE_PATH:blog}
  security:
    # 跨域白名单：同域部署（nginx 反代）留空即可；跨域部署时注入逗号分隔的来源，
    # 如 https://blog.example.com（Spring 自动按逗号拆分绑定到 List）
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
